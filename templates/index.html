<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Predictive Management System</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container py-5">

    <div class="text-center mb-4">
        <h1 class="fw-bold">HR Predictive Management System</h1>
        <p class="text-muted">Employee Attrition Prediction Dashboard</p>
    </div>

    <div class="card shadow-lg p-4">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Satisfaction Level</label>
                    <input type="number" step="0.1" name="satisfaction_level" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Evaluation</label>
                    <input type="number" step="0.1" name="last_evaluation" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Number of Projects</label>
                    <input type="number" name="number_project" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Average Monthly Hours</label>
                    <input type="number" name="average_montly_hours" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Time Spent in Company</label>
                    <input type="number" name="time_spend_company" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Work Accident</label>
                    <select name="Work_accident" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Promotion Last 5 Years</label>
                    <select name="promotion_last_5years" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Department</label>
                    <select name="Department" class="form-select">
                        <option>sales</option>
                        <option>technical</option>
                        <option>support</option>
                        <option>IT</option>
                        <option>product_mng</option>
                        <option>marketing</option>
                        <option>RandD</option>
                        <option>accounting</option>
                        <option>hr</option>
                        <option>management</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Salary</label>
                    <select name="salary" class="form-select">
                        <option>low</option>
                        <option>medium</option>
                        <option>high</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Overworked</label>
                    <select name="overworked" class="form-select">
                        <option>No</option>
                        <option>Yes</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Satisfaction Category</label>
                    <select name="satisfaction" class="form-select">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>
                </div>

            </div>

            <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    Predict Attrition
                </button>
            </div>

        </form>

    </div>


    {% if prediction_text %}

    <div class="card mt-5 shadow-lg p-4">

        <h3 class="text-center mb-4">Prediction Result</h3>

        <div class="row text-center">

            <div class="col-md-4">
                <div class="result-box">
                    <h5>Status</h5>
                    <h4>{{ prediction_text }}</h4>
                </div>
            </div>

            <div class="col-md-4">
                <div class="result-box">
                    <h5>Probability</h5>
                    <h4>{{ probability }}%</h4>
                </div>
            </div>

            <div class="col-md-4">
                <div class="result-box">
                    <h5>Risk Level</h5>
                    <h4>{{ risk }}</h4>
                </div>
            </div>

        </div>

        <div class="alert alert-info mt-4">
            <strong>Recommendation:</strong>
            {{ recommendation }}
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
